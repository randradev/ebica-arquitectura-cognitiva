# Neo4j para la memoria de las entidades (documento base §7, D7; PLAN D0-4).
# Uso: `docker compose up -d` desde la raíz del repositorio.
# Docker Compose lee NEO4J_USER y NEO4J_PASSWORD del archivo `.env` (no versionado).

services:
  neo4j:
    # Versión fija: Community 5.26 LTS (soporte extendido de la serie 5.x).
    image: neo4j:5.26.32-community
    container_name: ebica-neo4j
    restart: unless-stopped
    ports:
      # Solo accesible desde este PC: la memoria contiene conversaciones (§13.3).
      - "127.0.0.1:7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "127.0.0.1:7687:7687"   # protocolo bolt, el que usa el driver de Python
    environment:
      # La contraseña solo se aplica la primera vez que se crea el volumen.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en .env}"
      # Presupuesto de RAM de §9 (2–4 GB): heap para consultas + page cache
      # para mantener el grafo en memoria.
      NEO4J_server_memory_heap_initial__size: "1g"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
      # Por defecto Neo4j envía estadísticas de uso anónimas; todo queda en local (§13.3).
      NEO4J_dbms_usage__report_enabled: "false"
    # Tope duro del contenedor: heap + page cache + memoria nativa de la JVM.
    mem_limit: 2g
    volumes:
      # Volumen gestionado por Docker: los datos sobreviven a `docker compose down`.
      # Solo `docker compose down -v` los borra.
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
