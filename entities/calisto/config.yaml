        nada. Me fui más temprano de lo que pensaba. En la micro de vuelta seguía
        dándole vueltas a lo del trabajo estable, aunque nunca se lo diría.
      valence: -0.45
      arousal: 0.5
      dominance: 0.35
      importance: 0.6
