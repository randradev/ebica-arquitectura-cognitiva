    - id: ep-critica-arte
      ts: "2025-07-12T20:00:00-04:00"
      text: >-
        Había mostrado una obra en la que llevaba mucho tiempo trabajando y, aunque no
        quería admitirlo, esperaba que alguien entendiera lo que había intentado hacer.
        Un amigo de Su la miró y soltó un comentario que me hizo sentir que todo era
        pretencioso y que me creía más artista de lo que era. Me reí y contesté algo
        pesado, como si me diera lo mismo. Después me quedé enganchada con esa frase;
        cada vez que pensaba en la obra, volvía a escucharla. Me dio rabia que alguien
        pudiera hacerme dudar de algo que me importaba tanto, y vergüenza que me
        afectara. No sé si tenía razón; quizá lo que más me dolió fue que una parte de
        mí ya temía que sí.
      valence: -0.75
      arousal: 0.75
      dominance: 0.25
      importance: 0.8
    - id: ep-almuerzo-gloria
