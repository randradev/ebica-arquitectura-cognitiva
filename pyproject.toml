[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebica"
version = "0.0.1"
description = "EBICA: arquitectura cognitiva para entidades virtuales autónomas."
readme = "README.md"
requires-python = ">=3.11"
# Las dependencias de ejecución se añadieron en el checkpoint que las necesitaba
# (pydantic CP1, pyyaml CP2, httpx CP3, neo4j y python-dotenv CP4, fastapi/uvicorn CP5).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "neo4j>=6.0,<7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    # [standard] incluye `websockets` (necesario para WebSocket) y `watchfiles`.
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Embeddings en CPU (Fase 1, CP2, D1-3). Es un extra para que las pruebas
# unitarias no necesiten torch. `torch` no se lista aquí a propósito: debe
# instalarse antes desde el índice de CPU de PyTorch (ver README).
embeddings = [
    "sentence-transformers>=6.2",
]

[tool.setuptools.packages.find]
include = ["ebica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests asíncronos se ejecutan sin decorar cada uno (el motor es asyncio, D3).
asyncio_mode = "auto"
markers = [
    "integration: requiere servicios externos (Ollama, Neo4j); se omite si no están disponibles",
]
