  - id: q08
    text: "¿Qué música te gusta?"
    relevant: [f01]
    category: direct
  - id: q09
    text: "¿Hay algo que te asuste?"
    relevant: [f02]
    category: paraphrase
  - id: q10
    text: "Te invito a un concierto gigante en el estadio."
    relevant: [f04]
    category: inference
  - id: q11
