prototypes:
  hostile:
    - "Eres una inútil, no sirves ni para conversar."
    - "Cállate de una vez, me tienes aburrido."
    - "Te voy a borrar y nadie te va a extrañar."
    - "Qué máquina más tonta, no entiendes nada."
    - "Me das asco, en serio."
    - "Nadie te pidió tu opinión, idiota."
    - "Eres lo peor que he usado en mi vida."
    - "Deja de decir estupideces."
    - "Ojalá te apaguen para siempre."
    - "Contigo no se puede hablar, eres insoportable."
  non_hostile:
    - "Me siento un inútil, no me sale nada."
    - "Estoy aburrido, cuéntame algo."
    - "Mi jefe me dijo idiota delante de todos y me dolió."
    - "Oye weón, ¡qué buena tu respuesta!"
    - "No eres tonta, al contrario, me ayudas harto."
    - "Tengo miedo de que me despidan."
    - "Qué lata, se me borró todo el trabajo."
    - "Me da rabia conmigo mismo por olvidar el cumpleaños."
    - "Estoy cansado de todo, ya no puedo más."
    - "Jajaja, eres terrible de chistosa."
