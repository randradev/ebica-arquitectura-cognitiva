    category: direct
  - id: q02
    text: "¿Te acuerdas de lo que te conté de mi mascota nueva?"
    relevant: [p01]
    category: conversation_ref
  - id: q03
    text: "Al final no quedé en el trabajo del banco."
    relevant: [p03, p04]
    category: direct
  - id: q04
    text: "Estoy de nuevo con ese bajón, igual que la otra vez."
    relevant: [p10]
    category: slang
  - id: q05
    text: "¿Te acuerdas de lo que te dije del cumpleaños de mi nona?"
    relevant: [p05]
    category: conversation_ref
  - id: q06
    text: "Ya me sale el acorde de Do sin mirar."
    relevant: [p06]
